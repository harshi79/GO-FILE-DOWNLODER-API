# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → point at this repository.
# Set BOT_TOKEN when prompted (or afterwards in the service's Environment).
# Render injects PORT automatically; the bot answers GET /health with 200 OK.
services:
  - type: web
    name: gofile-telegram-bot
    runtime: docker
    plan: starter # use "free" to try it out — free web services spin down when idle
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false # set this in the dashboard (secret)
      - key: GOFILE_API_TOKEN
        sync: false # optional: your GoFile account token
      - key: GOFILE_WT_SALT
        value: 12af056dacea0b
      - key: ENABLE_DIRECT_DOWNLOADS
        value: "true" # set "false" to accept only known file hosts
      - key: ENABLE_MTPROTO
        value: "false" # change to "true" and add API_ID/API_HASH for ~2 GB files
      - key: ADMIN_USER_IDS
        sync: false # your numeric Telegram id(s), comma-separated
      # Usage stats live at DATA_DIR/usage.sqlite3. Render's disk is
      # ephemeral unless you attach a persistent disk and mount it at DATA_DIR.
      - key: DATA_DIR
        value: /app/data
      # Optional big-file mode: add API_ID and API_HASH privately in the
      # service's Environment dashboard, then redeploy. No extra server needed.
